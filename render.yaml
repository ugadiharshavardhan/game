# Render: New → Blueprint → point it at this repository.
services:
  - type: web
    name: moonlight-seva
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    plan: starter
    envVars:
      - key: PORT
        value: 8787
      - key: MIN_PLAYERS
        value: 1
      - key: MAX_PLAYERS
        value: 4
      - key: REQUIRE_READY
        value: true
      - key: DATA_FILE
        value: /var/data/boards.json
    disk:
      name: boards
      mountPath: /var/data
      sizeGB: 1
