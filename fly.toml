# Fly.io: `fly launch --no-deploy` once, then `fly deploy`.
app = "moonlight-seva"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  MIN_PLAYERS = "1"
  MAX_PLAYERS = "4"
  REQUIRE_READY = "true"
  # The leaderboards live on the mounted volume, so they survive a restart.
  DATA_FILE = "/data/boards.json"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options.response]
    pristine = true

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"

# fly volumes create data --size 1
[mounts]
  source = "data"
  destination = "/data"
