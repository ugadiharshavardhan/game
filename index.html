<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the canvas run under notches; the UI uses
         safe-area insets to stay clear of them. user-scalable=no stops a
         double-tap from zooming the page mid-run. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070f" />
    <meta
      name="description"
      content="Gather the offerings, read the sky, and reach the temple before the Chaturthi moon rises."
    />
    <title>Moonlight Seva</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
